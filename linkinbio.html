      <a class="linkbio__btn" href="#" data-social="Instagram">

<script>
(function(){
  var box = document.getElementById("bioLatest");
  if(!box || !window.OLAVIRAL_ARTICLES) return;
  box.innerHTML = window.OLAVIRAL_ARTICLES.slice(0,5).map(function(a){
    var s = window.olaviralSlug ? window.olaviralSlug(a.title) : "#";
    return '<a class="linkbio__btn linkbio__btn--sm" href="'+s+'.html">'+a.title+'</a>';
  }).join("");
})();
</script>
